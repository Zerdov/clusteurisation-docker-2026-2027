<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Ensembles réseaux et services du cluster Nebula</title>
  <desc>Diagramme d'ensembles : chaque bulle est un réseau Docker, chaque boîte un service placé dans les bulles qui le connectent. Intersection = services joignables sur les deux réseaux.</desc>

  <!-- Titre -->
  <text x="40" y="32" font-size="20" font-weight="bold" fill="#222">Nebula : ensembles réseaux et services</text>

  <!-- Univers : le cluster -->
  <rect x="40" y="50" width="920" height="640" rx="12" fill="#fafafa" stroke="#555" stroke-width="1.5"/>
  <text x="60" y="78" font-size="14" font-weight="bold" fill="#333">U = cluster Swarm (3 VM)</text>
  <text x="330" y="78" font-size="12" fill="#555">Un service appartient à un réseau s'il le déclare dans sa clé networks.</text>

  <!-- Ensemble P : réseau public -->
  <circle cx="360" cy="340" r="230" fill="#3b5bdb" fill-opacity="0.10" stroke="#3b5bdb" stroke-width="2"/>
  <text x="360" y="150" font-size="14" font-weight="bold" fill="#3b5bdb" text-anchor="middle">P · public</text>
  <text x="360" y="166" font-size="11" fill="#3b5bdb" text-anchor="middle">edge_public (overlay)</text>

  <!-- Ensemble I : réseau interne -->
  <circle cx="640" cy="340" r="230" fill="#9c36b5" fill-opacity="0.10" stroke="#9c36b5" stroke-width="2"/>
  <text x="640" y="150" font-size="14" font-weight="bold" fill="#9c36b5" text-anchor="middle">I · internal</text>
  <text x="640" y="166" font-size="11" fill="#9c36b5" text-anchor="middle">overlay, sans port publié</text>

  <!-- Ensemble R : réseau du registry, hors P et I -->
  <ellipse cx="840" cy="615" rx="110" ry="50" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="840" y="552" font-size="12" font-weight="bold" fill="#555" text-anchor="middle">R · registry_default</text>

  <!-- Services dans P uniquement -->
  <!-- traefik : manager -->
  <rect x="175" y="277" width="150" height="46" rx="8" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="250" y="297" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">traefik (edge)</text>
  <text x="250" y="312" font-size="11" fill="#444" text-anchor="middle">manager · ports 80, 8088</text>

  <!-- statut : worker app -->
  <rect x="175" y="377" width="150" height="46" rx="8" fill="#d4f0dd" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="250" y="397" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">statut</text>
  <text x="250" y="412" font-size="11" fill="#444" text-anchor="middle">2 rép. · tier≠data</text>

  <!-- Services dans P ∩ I -->
  <!-- comptes -->
  <rect x="430" y="277" width="140" height="46" rx="8" fill="#d4f0dd" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="500" y="297" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">comptes</text>
  <text x="500" y="312" font-size="11" fill="#444" text-anchor="middle">2 rép. · tier≠data</text>

  <!-- publications -->
  <rect x="430" y="357" width="140" height="46" rx="8" fill="#d4f0dd" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="500" y="377" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">publications</text>
  <text x="500" y="392" font-size="11" fill="#444" text-anchor="middle">2 rép. · tier≠data</text>

  <!-- Services dans I uniquement -->
  <!-- db : worker1 -->
  <rect x="665" y="217" width="150" height="46" rx="8" fill="#fde2c8" stroke="#d9822b" stroke-width="1.5"/>
  <text x="740" y="237" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">db (PostgreSQL)</text>
  <text x="740" y="252" font-size="11" fill="#444" text-anchor="middle">1 rép. · worker1 (data)</text>

  <!-- bus : worker1 -->
  <rect x="665" y="277" width="150" height="46" rx="8" fill="#fde2c8" stroke="#d9822b" stroke-width="1.5"/>
  <text x="740" y="297" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">bus (RabbitMQ)</text>
  <text x="740" y="312" font-size="11" fill="#444" text-anchor="middle">1 rép. · worker1 (data)</text>

  <!-- cache : worker app -->
  <rect x="665" y="357" width="150" height="46" rx="8" fill="#d4f0dd" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="740" y="377" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">cache (Redis)</text>
  <text x="740" y="392" font-size="11" fill="#444" text-anchor="middle">1 rép. · tier≠data</text>

  <!-- worker-medias : worker app -->
  <rect x="665" y="417" width="150" height="46" rx="8" fill="#d4f0dd" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="740" y="437" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">worker-medias</text>
  <text x="740" y="452" font-size="11" fill="#444" text-anchor="middle">2 rép. · tier≠data</text>

  <!-- registry : manager, hors P et I -->
  <rect x="760" y="592" width="160" height="46" rx="8" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="840" y="612" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">registry</text>
  <text x="840" y="627" font-size="11" fill="#444" text-anchor="middle">manager · port 5000</text>

  <!-- Notation ensembliste -->
  <text x="350" y="614" font-size="12" fill="#222">P = {traefik, statut, comptes, publications}</text>
  <text x="350" y="632" font-size="12" fill="#222">I = {db, bus, cache, comptes, publications, worker-medias}</text>
  <text x="350" y="650" font-size="12" fill="#222">P ∩ I = {comptes, publications}   ;   db ∉ P</text>
  <text x="350" y="668" font-size="12" fill="#222">R = {registry}   ;   P ∩ R = I ∩ R = ∅</text>

  <!-- Légende placement -->
  <text x="60" y="600" font-size="12" font-weight="bold" fill="#333">Placement</text>
  <rect x="60" y="610" width="14" height="14" rx="3" fill="#fde2c8" stroke="#d9822b"/>
  <text x="82" y="622" font-size="11" fill="#333">tier=data (worker1)</text>
  <rect x="60" y="630" width="14" height="14" rx="3" fill="#d4f0dd" stroke="#2e8b57"/>
  <text x="82" y="642" font-size="11" fill="#333">tier≠data (worker2, manager)</text>
  <rect x="60" y="650" width="14" height="14" rx="3" fill="#dbe4ff" stroke="#3b5bdb"/>
  <text x="82" y="662" font-size="11" fill="#333">manager (node.role)</text>
</svg>
