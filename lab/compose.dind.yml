# ===========================================================================
# Lab Swarm a TROIS noeuds sur une seule machine, pour tester la stack
# AVANT les VM. Chaque noeud est un daemon Docker distinct (Docker-in-Docker),
# avec son propre magasin d'images : une image absente du registry n'existe
# pas sur les autres noeuds, comme sur un vrai cluster.
#
#   docker compose -f lab/compose.dind.yml up -d
#
# Ce n'est PAS le livrable. Les noms de noeuds suivent l'annexe D (manager,
# worker1, worker2) pour que les commandes restent les memes sur les VM.
# ===========================================================================
name: nebula-lab

x-noeud: &noeud
  image: docker:29-dind
  privileged: true                 # un daemon Docker doit monter des FS et manipuler le reseau
  environment:
    DOCKER_TLS_CERTDIR: ""         # pas de TLS dans un lab
  command:
    - --insecure-registry=registry:5000
  networks: [labnet]
  restart: unless-stopped
  volumes:
    - ../:/repo:ro                 # le depot est visible dans /repo sur chaque noeud

services:

  # Registry EXTERNE au Swarm, comme au cahier des charges (section 8).
  registry:
    image: registry:3
    restart: unless-stopped
    volumes:
      - registry_data:/var/lib/registry
    networks: [labnet]
    ports:
      - "5000:5000"

  manager:
    <<: *noeud
    hostname: manager
    volumes:
      - manager_data:/var/lib/docker
      - ../:/repo:ro
    ports:
      - "8080:80"                  # point d'entree HTTP (edge) ; 80 hote est occupe

  worker1:
    <<: *noeud
    hostname: worker1
    volumes:
      - worker1_data:/var/lib/docker
      - ../:/repo:ro

  worker2:
    <<: *noeud
    hostname: worker2
    volumes:
      - worker2_data:/var/lib/docker
      - ../:/repo:ro

volumes:
  manager_data:
  worker1_data:
  worker2_data:
  registry_data:

networks:
  labnet:
    driver: bridge
